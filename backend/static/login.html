<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - VPD Technologies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
  </div>

  <main class="w-full max-w-md relative z-10">
    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-8 shadow-2xl shadow-indigo-950/40">
      
      <!-- Brand Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 shadow-lg shadow-indigo-500/25 mb-4">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Welcome Back</h1>
        <p class="text-slate-400 text-sm mt-1.5">Sign in to your VPD Technologies account</p>
      </div>

      <!-- Alert Message Box -->
      <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm transition-all duration-200"></div>

      <!-- Sign In Form -->
      <form id="loginForm" class="space-y-5" onsubmit="handleSignIn(event)">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Email address</label>
          <div class="relative">
            <input 
              type="email" 
              id="email" 
              name="email" 
              required
              placeholder="name@company.com" 
              class="w-full px-4 py-3 bg-slate-950/60 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
            />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-sm font-medium text-slate-300">Password</label>
            <a href="#" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">Forgot password?</a>
          </div>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              placeholder="••••••••" 
              class="w-full px-4 py-3 bg-slate-950/60 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
            />
          </div>
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center space-x-2.5 cursor-pointer">
            <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-slate-700 text-indigo-600 focus:ring-indigo-500 bg-slate-950/60" />
            <span class="text-slate-400">Remember me</span>
          </label>
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/40 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900 transition-all duration-200 flex items-center justify-center space-x-2"
        >
          <span>Sign In</span>
          <svg id="arrowIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
          <svg id="loadingSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </form>

      <!-- Footer Info -->
      <div class="mt-8 pt-6 border-t border-slate-800/80 text-center">
        <p class="text-xs text-slate-400">
          Connected to backend API: <code class="text-indigo-400 font-mono">/api/v1/auth/login</code>
        </p>
      </div>

    </div>
  </main>

  <script>
    async function handleSignIn(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');
      const arrowIcon = document.getElementById('arrowIcon');
      const spinner = document.getElementById('loadingSpinner');

      // Reset alert
      alertBox.classList.add('hidden');
      alertBox.className = "hidden mb-6 p-4 rounded-xl text-sm transition-all duration-200";

      // Show loader
      submitBtn.disabled = true;
      arrowIcon.classList.add('hidden');
      spinner.classList.remove('hidden');

      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          alertBox.className = "mb-6 p-4 rounded-xl text-sm bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 block";
          alertBox.innerHTML = `
            <div class="flex items-center space-x-2">
              <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
              </svg>
              <span>Login successful! Redirecting...</span>
            </div>
          `;
          setTimeout(() => {
            window.location.href = '/docs';
          }, 1500);
        } else {
          const message = data.message || (data.errors && data.errors[0]?.message) || 'Invalid email or password';
          alertBox.className = "mb-6 p-4 rounded-xl text-sm bg-rose-500/10 border border-rose-500/20 text-rose-300 block";
          alertBox.innerHTML = `
            <div class="flex items-center space-x-2">
              <svg class="w-5 h-5 text-rose-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
              </svg>
              <span>${message}</span>
            </div>
          `;
        }
      } catch (err) {
        alertBox.className = "mb-6 p-4 rounded-xl text-sm bg-rose-500/10 border border-rose-500/20 text-rose-300 block";
        alertBox.innerHTML = `
          <div class="flex items-center space-x-2">
            <svg class="w-5 h-5 text-rose-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            <span>Unable to connect to the server. Please check your network.</span>
          </div>
        `;
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('hidden');
        arrowIcon.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
